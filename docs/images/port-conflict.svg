<text x="407.0" y="20" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">taba — port-conflict</text>
<text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
<tspan x="22" y="62"><tspan fill="#3fb950" font-weight="bold">$ </tspan><tspan fill="#e6edf3" font-weight="bold">taba run --scope billing --name admin --port 8001 -- python3 -u -m http.server 8001</tspan></tspan>
<tspan x="22" y="82"><tspan fill="#ff7b72">taba: port 8001 is already claimed by taba service login-fix/web (~/demo/shop-login-fix)</tspan></tspan>
<tspan x="22" y="102"><tspan fill="#3fb950" font-weight="bold">$ </tspan><tspan fill="#e6edf3" font-weight="bold">taba run --scope billing --name admin --port 9000 -- python3 -u -m http.server 9000</tspan></tspan>
<tspan x="22" y="122"><tspan fill="#ff7b72">taba: port 9000 is in use by pid 29039, which is not managed by taba:</tspan></tspan>
<tspan x="22" y="142"><tspan fill="#c9d1d9">  Python -m http.server 9000</tspan></tspan>
<tspan x="22" y="162"><tspan fill="#c9d1d9">nothing was started</tspan></tspan>
</text>
