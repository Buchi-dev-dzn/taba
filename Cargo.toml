[package]
name = "taba"
version = "0.2.5"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
semver = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "preserve_order"] }
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
sha2 = "0.11"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
