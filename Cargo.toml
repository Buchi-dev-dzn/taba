[package]
name = "taba"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
libc = "0.2.191"
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
