name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The tests start `python3 -m http.server` (Windows: `python`).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The first start of a fresh Python can take tens of seconds on macOS
      # runners (first-launch checks, bytecode); do it before the tests time it.
      - name: Warm up Python
        shell: bash
        run: |
          python --version
          python -c "import http.server, runpy, signal, socketserver, subprocess"
          python3 -c "import http.server" || true
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Debug (temporary)
        if: failure() && runner.os == 'macOS'
        run: |
          set -x
          time python3 -c "import socket; print(socket.gethostname())"
          time python3 -c "import socket; print(socket.getfqdn('127.0.0.1'))"
          time python3 -c "import socket; print(socket.getfqdn(''))"
          (python3 -u -m http.server 18998 --bind 127.0.0.1 2>&1 | while read l; do echo "$(date +%T) $l"; done) &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:18998/ && { echo "up after $i s"; break; }; sleep 1; done
          export TABA_HOME=$RUNNER_TEMP/dbg
          ./target/debug/taba run --scope d --name web --port 18999 --wait=60 -- python3 -u -m http.server 18999 --bind 127.0.0.1 || true
          cat $TABA_HOME/logs/d/web.log || true
