name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The tests start `python3 -m http.server` (Windows: `python`).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Debug (temporary)
        if: failure() && runner.os == 'macOS'
        run: |
          set -x
          export TABA_HOME=$RUNNER_TEMP/dbg
          which -a python3; python3 --version
          ./target/debug/taba run --scope d --name web --port 18999 --wait=10 -- python3 -m http.server 18999 --bind 127.0.0.1 || true
          sleep 2
          ./target/debug/taba ps --json || true
          cat $TABA_HOME/logs/d/web.log || true
          curl -sv http://127.0.0.1:18999/ -o /dev/null || true
          ps -axo pid,pgid,stat,command | grep -i "[h]ttp.server" || true
          lsof -nP -iTCP:18999 || true
